<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshara & Achuth</title>

    <style>
        body {
            margin: 0;
            font-family: "Georgia", serif;
            background-color: #fffaf0;
            color: #5a3e2b;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .flower {
            font-size: 35px;
        }

        h1 {
            font-size: 55px;
            color: #8b6508;
            margin: 20px 0;
            font-weight: normal;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin-top: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .card {
            border: 1px solid #d4af37;
            padding: 35px;
            max-width: 500px;
            background-color: #fffdf7;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .date {
            font-size: 22px;
            color: #8b6508;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="card">

            <div class="flower">
                🌿 🌼 🌿
            </div>

            <p>
                Together with their families,
            </p>

            <h1>
                Akshara & Achuth
            </h1>

            <p>
                invite you to celebrate their wedding
            </p>

            <div class="date">
                23rd August 2026
            </div>

            <h2>
                Sheron Cultural Centre<br>
                Vengalloor
            </h2>

            <div class="flower">
                🌼 🌿 🌼
            </div>

        </div>

    </div>

</body>
</html>
