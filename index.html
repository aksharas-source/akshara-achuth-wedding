<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akshara & Achuth</title>

<link href="https://fonts.googleapis.com/css2?family=Lora&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #fff8ed;
    font-family: "Lora", serif;
    color: #5c4328;
}


.invitation {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}


.card {
    position: relative;
    overflow: hidden;
    max-width: 550px;
    width: 100%;
    text-align: center;
    background: #fffdf8;
    padding: 45px 30px;
    border: 2px solid #c9a227;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    animation: fadeIn 1.5s ease;
}


.flowers {
    font-size: 30px;
    letter-spacing: 8px;
}


.small-text {
    font-size: 18px;
    margin-top: 25px;
}


h1 {
    font-family: "Playfair Display", serif;
    font-size: 42px;
    font-weight: 500;
    color: #8a6512;
    margin: 25px 0;
}


.ampersand {
    font-size: 30px;
    color: #c9a227;
}


.details {
    margin-top: 35px;
    font-size: 20px;
    line-height: 1.8;
}


.quote {
    font-style: italic;
    margin-top: 30px;
    font-size: 18px;
}


/* Photo */

.photo-frame {
    margin-top: 40px;
}


.photo-frame img {
    width: 100%;
    max-width: 350px;
    height: auto;
    display: block;
    margin: auto;
    border: 8px solid #d4af37;
    padding: 8px;
    background: #fffdf8;
    box-sizing: border-box;
}


.photo-frame p {
    font-style: italic;
    margin-top: 15px;
}


/* Location */

.location-button {
    margin-top: 30px;
}


.location-button a {
    display: inline-block;
    padding: 12px 28px;
    background: #c9a227;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
}


/* RSVP */

.rsvp {
    margin-top: 45px;
    font-size: 18px;
    line-height: 1.8;
}


.rsvp-button {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 30px;
    border: 2px solid #c9a227;
    color: #8a6512;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
}


/* Floral corners */

.corner-flower {
    position: absolute;
    font-size: 25px;
    z-index: 1;
}


.top-left {
    top: 20px;
    left: 20px;
}


.top-right {
    top: 20px;
    right: 20px;
}


.bottom-left {
    bottom: 20px;
    left: 20px;
}


.bottom-right {
    bottom: 20px;
    right: 20px;
}


/* Animation */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* Extra mobile adjustment */

@media (max-width: 500px) {

    h1 {
        font-size: 38px;
    }

    .details {
        font-size: 18px;
    }

    .card {
        padding: 35px 20px;
    }

}

</style>

</head>


<body>

<p class="quote">
